<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecurePay AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
    <div class="w-full max-w-md">
        <div class="glass rounded-2xl shadow-2xl p-8 border border-slate-700 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-500"></div>
            
            <div class="text-center mb-8">
                <i class="fa-solid fa-shield-halved text-cyan-400 text-5xl mb-4"></i>
                <h1 class="text-3xl font-bold text-white tracking-wide">SecurePay AI</h1>
                <p class="text-slate-400 mt-2">Credit Card Fraud Detection</p>
                <p class="text-xs text-cyan-500 mt-1 uppercase tracking-widest">AI-powered transaction security</p>
            </div>

            {% if error %}
            <div class="bg-red-500/10 border border-red-500/50 text-red-500 text-sm px-4 py-3 rounded mb-4">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-4">
                    <label class="block text-slate-400 text-sm mb-2">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-500"></i>
                        <input type="text" name="username" value="demo" class="w-full bg-slate-900/50 border border-slate-700 text-white rounded-lg py-3 pl-12 pr-4 focus:outline-none focus:border-cyan-500 transition" required>
                    </div>
                </div>
                <div class="mb-6">
                    <label class="block text-slate-400 text-sm mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500"></i>
                        <input type="password" name="password" id="pwd" value="demo123" class="w-full bg-slate-900/50 border border-slate-700 text-white rounded-lg py-3 pl-12 pr-4 focus:outline-none focus:border-cyan-500 transition" required>
                        <i class="fa-solid fa-eye absolute right-4 top-3.5 text-slate-500 cursor-pointer hover:text-white" onclick="document.getElementById('pwd').type = document.getElementById('pwd').type === 'password' ? 'text' : 'password'"></i>
                    </div>
                </div>
                
                <div class="flex justify-between items-center mb-6 text-sm">
                    <label class="flex items-center text-slate-400 cursor-pointer">
                        <input type="checkbox" class="mr-2 rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-cyan-500"> Remember me
                    </label>
                    <a href="#" class="text-cyan-400 hover:text-cyan-300">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform transition hover:-translate-y-0.5">
                    Demo Login
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-slate-700/50 text-center text-xs text-slate-500">
                <p>Use demo credentials: Username: <b>demo</b> / Password: <b>demo123</b></p>
                <p class="mt-2 text-[10px]">Educational Demo — No real financial information is processed.</p>
            </div>
        </div>
    </div>
</body>
</html>
