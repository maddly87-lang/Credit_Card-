{% extends 'layout.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Analytics Dashboard</h1>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    <!-- Daily Spending Chart -->
    <div class="glass-card rounded-xl p-6 h-80">
        <h3 class="font-bold text-slate-200 mb-4">Daily Spending Pattern</h3>
        <div class="relative h-64 w-full">
            <canvas id="dailySpendingChart"></canvas>
        </div>
    </div>

    <!-- Category Spending -->
    <div class="glass-card rounded-xl p-6 h-80">
        <h3 class="font-bold text-slate-200 mb-4">Category Breakdown</h3>
        <div class="relative h-64 w-full flex justify-center">
            <canvas id="categoryChart"></canvas>
        </div>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Fraud vs Genuine -->
    <div class="glass-card rounded-xl p-6 h-80 md:col-span-2">
        <h3 class="font-bold text-slate-200 mb-4">Monthly Transactions Overview</h3>
        <div class="relative h-64 w-full">
            <canvas id="monthlyChart"></canvas>
        </div>
    </div>

    <!-- Risk Distribution -->
    <div class="glass-card rounded-xl p-6 h-80">
        <h3 class="font-bold text-slate-200 mb-4">Fraud Risk Distribution</h3>
        <div class="relative h-64 w-full flex justify-center">
            <canvas id="riskChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = '#1e293b';

    // 1. Daily Spending (Line)
    new Chart(document.getElementById('dailySpendingChart'), {
        type: 'line',
        data: {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
            datasets: [{
                label: 'Amount (₹)',
                data: [1200, 2500, 850, 4200, 1500, 8900, 3100],
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                borderWidth: 2, tension: 0.3, fill: true
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    // 2. Category Breakdown (Doughnut)
    new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
            labels: ['Food', 'Shopping', 'Travel', 'Entertainment', 'Bills', 'Other'],
            datasets: [{
                data: [8500, 15200, 6800, 4200, 14000, 2500],
                backgroundColor: ['#f43f5e', '#a855f7', '#3b82f6', '#14b8a6', '#f59e0b', '#64748b'],
                borderWidth: 0
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'right' } } }
    });

    // 3. Monthly (Bar)
    new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
            datasets: [
                { label: 'Genuine', data: [120, 150, 180, 130, 160, 210], backgroundColor: '#10b981' },
                { label: 'Fraud', data: [2, 1, 5, 0, 1, 3], backgroundColor: '#ef4444' }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
    });

    // 4. Risk Distribution (Pie)
    new Chart(document.getElementById('riskChart'), {
        type: 'pie',
        data: {
            labels: ['Low Risk', 'Medium Risk', 'High Risk'],
            datasets: [{
                data: [85, 12, 3],
                backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                borderWidth: 0
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
    });
</script>
{% endblock %}
